version: 2
updates:
  # Grouped so a week of patch bumps arrives as one PR per ecosystem rather
  # than a dozen. Majors stay separate: they are the ones worth reading.
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /spore-stream
    schedule: { interval: weekly }

  - package-ecosystem: cargo
    directory: /spore-smb
    schedule: { interval: weekly }

  # Keeps the Node 20 deprecation warnings from the release workflow current.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
