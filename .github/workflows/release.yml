name: Release

on:
  push:
    tags: ["v*"]
  # Lets us (re)build and publish an image for a version whose tag already
  # exists, without deleting and re-pushing the tag - which would re-run the
  # release step below and overwrite that release's notes.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build and publish, without the leading v (e.g. 0.6.3)"
        required: true

permissions:
  contents: write
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          build-args: |
            BUILD_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 << 'PYEOF'
          import re, os
          version = os.environ['VERSION']
          repo = os.environ['REPO']
          with open('CHANGELOG.md') as f:
              content = f.read()
          pattern = rf'## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## \[|\Z)'
          m = re.search(pattern, content, re.DOTALL)
          notes = m.group(1).strip() if m else f'_See [CHANGELOG.md](https://github.com/{repo}/blob/main/CHANGELOG.md) for full details._'
          body = (
              f'## Install\n\n'
              f'```bash\n'
              f'docker pull ghcr.io/{repo}:{version}\n'
              f'```\n\n'
              f'---\n\n'
              f'{notes}\n'
          )
          with open('release_notes.md', 'w') as f:
              f.write(body)
          PYEOF
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          REPO: ${{ github.repository }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          body_path: release_notes.md
