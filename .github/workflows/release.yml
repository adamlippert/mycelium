name: Release

on:
  push:
    tags: ["v*"]
  # Lets us (re)build and publish an image for a version whose tag already
  # exists, without deleting and re-pushing the tag - which would re-run the
  # release step below and overwrite that release's notes. Dispatch runs from
  # the default branch, so it always uses the current workflow.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build and publish, without the leading v (e.g. 0.8.0)"
        required: true

permissions:
  contents: write
  packages: write

# Two releases must never publish at once. Whichever finishes last wins the
# latest tag, and that is not necessarily the newer version: 0.7.5 and 0.7.6
# had to be serialised by hand for exactly this reason.
concurrency:
  group: release
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Gate the release on the test suites. ci.yml exposes workflow_call, so this
  # is the whole quality gate in one line.
  test:
    uses: ./.github/workflows/ci.yml

  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          version="${version#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building ${version}"

  # One job per architecture, each on a runner of that architecture. Previously
  # a single amd64 runner built both halves, emulating arm64 through QEMU: the
  # Rust spore-smb compile alone took 19 minutes that way. Native runners are
  # free for public repositories, and the two halves now run in parallel, so
  # the release takes as long as the slower arch rather than the sum of both.
  build:
    name: Build ${{ matrix.arch }}
    needs: [test, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed without a tag, identified only by digest; the publish job below
      # assembles the two digests into one multi-arch tag.
      #
      # Cache lives in the registry, not in the Actions cache. The Actions
      # cache is capped at 10GB per repository and evicts least-recently-used
      # entries, so a mode=max cache covering both architectures kept evicting
      # itself between releases: that is why builds were 6 minutes when a cache
      # happened to survive and 30 when it did not. A registry cache has no
      # such cap, and each arch keeps its own so they cannot evict each other.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_VERSION=${{ needs.version.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }},mode=max

      - name: Save digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish manifest and release
    needs: [build, version]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Staples the per-arch images into one tag, so docker pull picks the
      # right architecture automatically.
      - name: Create the multi-arch tags
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest" \
            $(printf "${IMAGE}@sha256:%s " *)

      # A published manifest that is missing an architecture would only be
      # discovered by whoever pulls it on that architecture.
      - name: Verify both architectures are present
        run: |
          docker buildx imagetools inspect "${IMAGE}:${VERSION}" | tee /tmp/manifest.txt
          for arch in amd64 arm64; do
            grep -q "linux/${arch}" /tmp/manifest.txt \
              || { echo "::error::${IMAGE}:${VERSION} is missing linux/${arch}"; exit 1; }
          done
          echo "amd64 and arm64 both present"

      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 << 'PYEOF'
          import re, os
          version = os.environ['VERSION']
          repo = os.environ['REPO']
          with open('CHANGELOG.md') as f:
              content = f.read()
          pattern = rf'## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## \[|\Z)'
          m = re.search(pattern, content, re.DOTALL)
          notes = m.group(1).strip() if m else f'_See [CHANGELOG.md](https://github.com/{repo}/blob/main/CHANGELOG.md) for full details._'
          body = (
              f'## Install\n\n'
              f'```bash\n'
              f'docker pull ghcr.io/{repo}:{version}\n'
              f'```\n\n'
              f'---\n\n'
              f'{notes}\n'
          )
          with open('release_notes.md', 'w') as f:
              f.write(body)
          PYEOF
        env:
          REPO: ${{ github.repository }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          body_path: release_notes.md
