# Mycelium - production deployment.
#
#   cp .env.example .env     # then fill it in (TORBOX_API_KEY is required)
#   docker compose -f docker-compose.prod.yml up -d
#
# Uses the published image. To build from source instead, use the plain
# docker-compose.yml. Compose reads .env for both the ${...} substitutions
# below and the container's own environment, so one file covers both.

services:
  mycelium:
    # Pin a version in production so a redeploy cannot silently move you to a
    # new release: set MYCELIUM_VERSION=0.7.2 in .env. Defaults to latest.
    image: ghcr.io/adamlippert/mycelium:${MYCELIUM_VERSION:-latest}
    container_name: mycelium
    restart: unless-stopped

    env_file:
      - .env

    environment:
      - LISTEN_HOST=0.0.0.0
      - LISTEN_PORT=8088
      - MEDIA_PATH=/media
      - TZ=${TZ:-UTC}
      # Set these to the ids your Jellyfin/Plex container runs as, so all three
      # can delete each other's files - `docker exec jellyfin id` prints them.
      # Left at 0, Mycelium runs as root and owns everything it writes, and
      # your media server cannot delete any of it from its own UI.
      - PUID=${PUID:-0}
      - PGID=${PGID:-0}

    ports:
      - "${MYCELIUM_PORT:-8088}:8088"
      # SMB and NFS shares of the virtual library. They are read-only and
      # ANONYMOUS, so they are off by default. Uncomment only if you use them,
      # and keep the 127.0.0.1 prefix unless the host sits on a trusted private
      # network. Never expose these to the internet.
      # - "127.0.0.1:4450:445"
      # - "127.0.0.1:2049:2049"

    volumes:
      # Database, backups and Plex stub files. A named volume, so it survives
      # `docker compose down` and is not affected by host file permissions.
      - mycelium-data:/data
      # The .strm library. The left side must be the SAME host path your
      # Jellyfin or Plex container has mounted, or they will not see anything.
      - ${MEDIA_HOST_PATH:-./media}:/media

    # Hardware transcoding, used only by the webplayer plugin. Uncomment both
    # blocks if the host has an Intel GPU. group_add needs the host's render
    # group id as a NUMBER (`getent group render`), because the name does not
    # exist inside the container. A missing /dev/dri prevents the container
    # from starting at all, so leave these commented out on a VPS.
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "993"

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8088/health',timeout=5).status==200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      # The first start after setting PUID corrects ownership across the whole
      # media tree, which takes minutes on a large library. A short start_period
      # would report the container unhealthy while that is still running.
      start_period: 300s

    mem_limit: 3g
    mem_reservation: 256m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    # Join an existing network if your media server is on one, so Jellyfin can
    # be reached as http://jellyfin:8096 rather than by IP.
    # networks:
    #   media-stack:
    #     aliases: [mycelium]

volumes:
  mycelium-data:

