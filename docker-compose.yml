services:
  mycelium:
    build: .
    image: ghcr.io/adamlippert/mycelium:latest
    container_name: mycelium
    restart: unless-stopped
    ports:
      - "8088:8088"
      - "8089:8089"
      # NFS and SMB shares. These are the virtual library exposed read-only and
      # anonymously - fine on a home LAN, but do NOT leave them reachable from
      # the internet. On a public host prefix both with 127.0.0.1: to bind them
      # to loopback, or delete them if you only use Jellyfin/Plex directly.
      - "2049:2049"
      - "4450:445"
    env_file:
      - .env
    environment:
      - LISTEN_HOST=0.0.0.0
      - LISTEN_PORT=8088
      # Match your Jellyfin/Plex user so all three can delete each other's
      # files. `docker exec jellyfin id` prints the numbers. See .env.example.
      - PUID=${PUID:-0}
      - PGID=${PGID:-0}
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "937"
    volumes:
      - ./data:/data
      - ./static/jellyfin-splash.png:/app/static/jellyfin-splash.png:ro
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8088/health',timeout=5); sys.exit(0 if r.status==200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
